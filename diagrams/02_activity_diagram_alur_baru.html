<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Activity Diagram Alur Baru - SPR JTI Polinema</title>
<style>body { margin: 0; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }</style>
</head>
<body>
<svg width="1100" height="1200" viewBox="0 0 1100 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Activity Diagram – Alur Baru</text>
  <text x="550" y="52" text-anchor="middle" font-size="13" fill="#444">Proses Peminjaman Ruangan JTI Polinema (Sistem Baru)</text>

  <!-- Swimlane Headers -->
  <rect x="10" y="68" width="175" height="1110" fill="#fff9e6" stroke="#ddd" stroke-width="1"/>
  <rect x="185" y="68" width="175" height="1110" fill="#e8f4ff" stroke="#ddd" stroke-width="1"/>
  <rect x="360" y="68" width="200" height="1110" fill="#f0fff0" stroke="#ddd" stroke-width="1"/>
  <rect x="560" y="68" width="180" height="1110" fill="#fff0f8" stroke="#ddd" stroke-width="1"/>
  <rect x="740" y="68" width="175" height="1110" fill="#f8f0ff" stroke="#ddd" stroke-width="1"/>
  <rect x="915" y="68" width="175" height="1110" fill="#f0f8ff" stroke="#ddd" stroke-width="1"/>

  <!-- Lane titles -->
  <text x="97" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#886a00">Peminjam</text>
  <text x="272" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#005f9e">Sistem</text>
  <text x="460" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7a1a">Verifikator Tahap 1</text>
  <text x="650" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a005f">Verifikator Tahap 2</text>
  <text x="827" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f0a8a">Admin</text>
  <text x="1002" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#005f5f">Scheduler</text>

  <!-- Helper macro: rounded rect activity -->
  <!-- Activities in Peminjam lane -->
  <!-- START -->
  <circle cx="97" cy="130" r="14" fill="#1a1a2e"/>
  <line x1="97" y1="144" x2="97" y2="163" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Login -->
  <rect x="30" y="163" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="186" text-anchor="middle" font-size="11" fill="#1a1a2e">Login ke Sistem</text>
  <line x1="97" y1="199" x2="97" y2="218" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Cek Ruangan Tersedia -->
  <rect x="30" y="218" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="237" text-anchor="middle" font-size="11" fill="#1a1a2e">Lihat Info Ruangan</text>
  <text x="97" y="249" text-anchor="middle" font-size="10" fill="#555">&amp; Jadwal</text>
  <line x1="97" y1="255" x2="97" y2="274" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Isi Form Pengajuan -->
  <rect x="30" y="274" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="293" text-anchor="middle" font-size="11" fill="#1a1a2e">Isi &amp; Kirim Form</text>
  <text x="97" y="305" text-anchor="middle" font-size="10" fill="#555">Pengajuan</text>
  <line x1="164" y1="292" x2="185" y2="292" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sistem: Validasi & Simpan Pengajuan -->
  <rect x="195" y="274" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="293" text-anchor="middle" font-size="11" fill="#1a1a2e">Validasi &amp; Simpan</text>
  <text x="272" y="305" text-anchor="middle" font-size="10" fill="#555">Buat Antrian Approval</text>
  <line x1="272" y1="310" x2="272" y2="329" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sistem: Notifikasi ke Verifikator -->
  <rect x="195" y="329" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="348" text-anchor="middle" font-size="11" fill="#1a1a2e">Notifikasi ke</text>
  <text x="272" y="360" text-anchor="middle" font-size="10" fill="#555">Verifikator Tahap 1</text>
  <line x1="350" y1="347" x2="360" y2="347" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Verifikator 1: Tinjau Pengajuan -->
  <rect x="370" y="329" width="170" height="36" rx="18" fill="#b8ffcc" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="455" y="348" text-anchor="middle" font-size="11" fill="#1a1a2e">Tinjau Pengajuan</text>
  <text x="455" y="360" text-anchor="middle" font-size="10" fill="#555">&amp; Putuskan</text>

  <!-- Decision: VRF1 Approve? -->
  <polygon points="455,377 510,404 455,431 400,404" fill="#fff" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="455" y="400" text-anchor="middle" font-size="10" fill="#1a1a2e">Setuju?</text>
  <line x1="455" y1="366" x2="455" y2="377" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VRF1 Tolak → Sistem update status Ditolak -->
  <line x1="400" y1="404" x2="272" y2="404" stroke="#e04040" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="336" y="398" text-anchor="middle" font-size="10" fill="#e04040">Tolak</text>
  <rect x="195" y="388" width="155" height="36" rx="18" fill="#ffc8c8" stroke="#e04040" stroke-width="1.5"/>
  <text x="272" y="407" text-anchor="middle" font-size="11" fill="#1a1a2e">Update Status</text>
  <text x="272" y="419" text-anchor="middle" font-size="10" fill="#555">"Ditolak"</text>
  <line x1="272" y1="424" x2="272" y2="444" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="195" y="444" width="155" height="36" rx="18" fill="#ffc8c8" stroke="#e04040" stroke-width="1.5"/>
  <text x="272" y="463" text-anchor="middle" font-size="11" fill="#1a1a2e">Notifikasi Penolakan</text>
  <text x="272" y="475" text-anchor="middle" font-size="10" fill="#555">ke Peminjam</text>
  <line x1="216" y1="462" x2="164" y2="462" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="444" width="134" height="36" rx="18" fill="#ffc8c8" stroke="#e04040" stroke-width="1.5"/>
  <text x="97" y="463" text-anchor="middle" font-size="11" fill="#1a1a2e">Terima Notifikasi</text>
  <text x="97" y="475" text-anchor="middle" font-size="10" fill="#555">Penolakan</text>

  <!-- VRF1 Setuju → go to VRF2 -->
  <line x1="510" y1="404" x2="640" y2="404" stroke="#1a7a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="572" y="398" text-anchor="middle" font-size="10" fill="#1a7a1a">Setuju</text>

  <!-- VRF2: Tinjau -->
  <rect x="570" y="386" width="160" height="36" rx="18" fill="#ffc8f0" stroke="#8a005f" stroke-width="1.5"/>
  <text x="650" y="405" text-anchor="middle" font-size="11" fill="#1a1a2e">Tinjau Pengajuan</text>
  <text x="650" y="417" text-anchor="middle" font-size="10" fill="#555">&amp; Putuskan</text>

  <!-- Decision VRF2 -->
  <polygon points="650,433 705,460 650,487 595,460" fill="#fff" stroke="#8a005f" stroke-width="1.5"/>
  <text x="650" y="456" text-anchor="middle" font-size="10" fill="#8a005f">Setuju?</text>
  <line x1="650" y1="422" x2="650" y2="433" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VRF2 Tolak -->
  <line x1="595" y1="460" x2="350" y2="460" stroke="#e04040" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="473" y="454" text-anchor="middle" font-size="10" fill="#e04040">Tolak</text>

  <!-- VRF2 Setuju → Admin -->
  <line x1="705" y1="460" x2="830" y2="460" stroke="#8a005f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="768" y="454" text-anchor="middle" font-size="10" fill="#8a005f">Setuju</text>

  <!-- Admin: Terima/Tolak Final -->
  <rect x="745" y="443" width="165" height="36" rx="18" fill="#ddb8ff" stroke="#5f0a8a" stroke-width="1.5"/>
  <text x="827" y="462" text-anchor="middle" font-size="11" fill="#1a1a2e">Verifikasi Final</text>
  <text x="827" y="474" text-anchor="middle" font-size="10" fill="#555">(Terima / Tolak)</text>

  <!-- Decision Admin -->
  <polygon points="827,490 882,517 827,544 772,517" fill="#fff" stroke="#5f0a8a" stroke-width="1.5"/>
  <text x="827" y="513" text-anchor="middle" font-size="10" fill="#5f0a8a">Setuju?</text>
  <line x1="827" y1="479" x2="827" y2="490" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Admin Tolak -->
  <line x1="772" y1="517" x2="560" y2="517" stroke="#e04040" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="666" y="511" text-anchor="middle" font-size="10" fill="#e04040">Tolak</text>

  <!-- Admin Terima → Sistem Update "Diterima" dan buat jadwal -->
  <line x1="882" y1="517" x2="940" y2="517" stroke="#5f0a8a" stroke-width="1.5"/>
  <line x1="940" y1="517" x2="940" y2="551" stroke="#5f0a8a" stroke-width="1.5"/>
  <line x1="940" y1="551" x2="360" y2="551" stroke="#5f0a8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="882" y="511" text-anchor="middle" font-size="10" fill="#5f0a8a">Terima</text>

  <!-- Sistem: buat jadwal & status "Akan Datang" -->
  <rect x="195" y="534" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="553" text-anchor="middle" font-size="11" fill="#1a1a2e">Buat Jadwal &amp;</text>
  <text x="272" y="565" text-anchor="middle" font-size="10" fill="#555">Status "Akan Datang"</text>
  <line x1="272" y1="570" x2="272" y2="590" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Notifikasi Diterima ke Peminjam -->
  <rect x="195" y="590" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="609" text-anchor="middle" font-size="11" fill="#1a1a2e">Notifikasi "Diterima"</text>
  <text x="272" y="621" text-anchor="middle" font-size="10" fill="#555">ke Peminjam</text>
  <line x1="216" y1="608" x2="164" y2="608" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Peminjam terima notif diterima -->
  <rect x="30" y="590" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="609" text-anchor="middle" font-size="11" fill="#1a1a2e">Terima Notifikasi</text>
  <text x="97" y="621" text-anchor="middle" font-size="10" fill="#555">Pengajuan Diterima</text>
  <line x1="97" y1="626" x2="97" y2="645" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tunggu Jadwal Berlangsung -->
  <rect x="30" y="645" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="664" text-anchor="middle" font-size="11" fill="#1a1a2e">Menggunakan</text>
  <text x="97" y="676" text-anchor="middle" font-size="10" fill="#555">Ruangan</text>

  <!-- Scheduler: Auto update "Berlangsung" -->
  <rect x="925" y="645" width="155" height="36" rx="18" fill="#d0f0ff" stroke="#005f5f" stroke-width="1.5"/>
  <text x="1002" y="664" text-anchor="middle" font-size="11" fill="#1a1a2e">Auto-Update Status</text>
  <text x="1002" y="676" text-anchor="middle" font-size="10" fill="#555">"Berlangsung"</text>
  <!-- Arrow: Scheduler → Sistem "Berlangsung" line -->
  <line x1="925" y1="663" x2="350" y2="663" stroke="#005f5f" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr)"/>

  <!-- Sistem: status "Berlangsung" -->
  <rect x="195" y="645" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="664" text-anchor="middle" font-size="11" fill="#1a1a2e">Update Status</text>
  <text x="272" y="676" text-anchor="middle" font-size="10" fill="#555">"Berlangsung"</text>
  <line x1="97" y1="681" x2="97" y2="700" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Peminjam: Unggah Dokumentasi -->
  <rect x="30" y="700" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="719" text-anchor="middle" font-size="11" fill="#1a1a2e">Unggah Dokumentasi</text>
  <text x="97" y="731" text-anchor="middle" font-size="10" fill="#555">(Foto, Kebersihan, Kunci)</text>
  <line x1="164" y1="718" x2="185" y2="718" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sistem: Simpan dok & status "Dalam Peninjauan" -->
  <rect x="195" y="700" width="155" height="36" rx="18" fill="#b8deff" stroke="#005f9e" stroke-width="1.5"/>
  <text x="272" y="719" text-anchor="middle" font-size="11" fill="#1a1a2e">Simpan Dok &amp; Status</text>
  <text x="272" y="731" text-anchor="middle" font-size="10" fill="#555">"Ditinjau"</text>
  <line x1="350" y1="718" x2="745" y2="718" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Admin: Periksa Dok -->
  <rect x="745" y="700" width="165" height="36" rx="18" fill="#ddb8ff" stroke="#5f0a8a" stroke-width="1.5"/>
  <text x="827" y="719" text-anchor="middle" font-size="11" fill="#1a1a2e">Periksa Dokumentasi</text>
  <text x="827" y="731" text-anchor="middle" font-size="10" fill="#555">&amp; Tentukan Status</text>

  <!-- Decision Admin dok -->
  <polygon points="827,747 882,774 827,801 772,774" fill="#fff" stroke="#5f0a8a" stroke-width="1.5"/>
  <text x="827" y="770" text-anchor="middle" font-size="10" fill="#5f0a8a">Sesuai?</text>
  <line x1="827" y1="736" x2="827" y2="747" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tidak Sesuai: status "Dok Tidak Sesuai" -->
  <line x1="772" y1="774" x2="350" y2="774" stroke="#e04040" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="561" y="768" text-anchor="middle" font-size="10" fill="#e04040">Tidak Sesuai</text>
  <rect x="195" y="756" width="155" height="36" rx="18" fill="#ffc8c8" stroke="#e04040" stroke-width="1.5"/>
  <text x="272" y="775" text-anchor="middle" font-size="11" fill="#1a1a2e">Status "Dok Tidak</text>
  <text x="272" y="787" text-anchor="middle" font-size="10" fill="#555">Sesuai", Notif Peminjam</text>
  <line x1="216" y1="774" x2="164" y2="774" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="756" width="134" height="36" rx="18" fill="#ffc8c8" stroke="#e04040" stroke-width="1.5"/>
  <text x="97" y="775" text-anchor="middle" font-size="11" fill="#1a1a2e">Unggah Ulang</text>
  <text x="97" y="787" text-anchor="middle" font-size="10" fill="#555">Dokumentasi</text>
  <!-- Back to unggah dok -->
  <line x1="97" y1="792" x2="97" y2="808" stroke="#e04040" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="97" y1="808" x2="18" y2="808" stroke="#e04040" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="18" y1="808" x2="18" y2="718" stroke="#e04040" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="18" y1="718" x2="30" y2="718" stroke="#e04040" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Sesuai: status "Selesai" -->
  <line x1="882" y1="774" x2="940" y2="774" stroke="#1a7a1a" stroke-width="1.5"/>
  <line x1="940" y1="774" x2="940" y2="830" stroke="#1a7a1a" stroke-width="1.5"/>
  <line x1="940" y1="830" x2="350" y2="830" stroke="#1a7a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="882" y="768" text-anchor="middle" font-size="10" fill="#1a7a1a">Sesuai</text>

  <!-- Sistem: Status Selesai -->
  <rect x="195" y="812" width="155" height="36" rx="18" fill="#b8ffcc" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="272" y="831" text-anchor="middle" font-size="11" fill="#1a1a2e">Update Status</text>
  <text x="272" y="843" text-anchor="middle" font-size="10" fill="#555">"Selesai" (Riwayat)</text>
  <line x1="272" y1="848" x2="272" y2="867" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Notif Selesai ke Peminjam -->
  <rect x="195" y="867" width="155" height="36" rx="18" fill="#b8ffcc" stroke="#1a7a1a" stroke-width="1.5"/>
  <text x="272" y="886" text-anchor="middle" font-size="11" fill="#1a1a2e">Notifikasi "Selesai"</text>
  <text x="272" y="898" text-anchor="middle" font-size="10" fill="#555">ke Peminjam</text>
  <line x1="216" y1="885" x2="164" y2="885" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="867" width="134" height="36" rx="18" fill="#ffe9a0" stroke="#c8a600" stroke-width="1.5"/>
  <text x="97" y="886" text-anchor="middle" font-size="11" fill="#1a1a2e">Peminjaman Selesai</text>
  <text x="97" y="898" text-anchor="middle" font-size="10" fill="#555">&amp; Tercatat di Riwayat</text>
  <line x1="97" y1="903" x2="97" y2="920" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="97" cy="940" r="10" fill="none" stroke="#1a1a2e" stroke-width="3"/>
  <circle cx="97" cy="940" r="6" fill="#1a1a2e"/>

  <!-- Status legend box -->
  <rect x="200" y="920" width="700" height="60" rx="8" fill="#f8f8ff" stroke="#aaa" stroke-width="1"/>
  <text x="550" y="939" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Alur Status Jadwal:</text>
  <text x="550" y="955" text-anchor="middle" font-size="11" fill="#555">Diajukan → (Approval Berjenjang) → Diterima/Ditolak → Akan Datang → Berlangsung → Ditinjau → Selesai / Dok Tidak Sesuai</text>
  <text x="550" y="972" text-anchor="middle" font-size="10" fill="#888">Auto-update "Berlangsung" dijalankan oleh Scheduler (Cron Job) setiap menit berdasarkan tanggal &amp; jam jadwal</text>
</svg>
</body>
</html>
